[project]
name = "electiva-3-proyecto-final"
version = "0.1.0"
description = "Impacto del Fenómeno de El Niño (índice ONI) en los precios de alimentos frescos en Popayán (SIPSA-DANE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.2",
    "pyarrow>=15.0.0",
    "statsmodels>=0.14.1",
    "scikit-learn>=1.4.2",
    "plotly>=5.20.0",
    "matplotlib>=3.8.3",
    "seaborn>=0.13.2",
    "streamlit>=1.35.0",
    "joblib>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "nbconvert>=7.16.0",
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
